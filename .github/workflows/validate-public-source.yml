name: Validate public source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend test dependencies
        run: python -m pip install pytest -r requirements.txt
      - name: Run backend tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q tests 2>&1 | tee backend-test-results.txt
          echo '## Backend test result' >> "$GITHUB_STEP_SUMMARY"
          tail -n 2 backend-test-results.txt >> "$GITHUB_STEP_SUMMARY"
  frontend:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Run frontend tests
        working-directory: frontend
        env:
          TZ: America/Regina
        run: |
          npm test 2>&1 | tee frontend-test-results.txt
          echo '## Frontend test result' >> "$GITHUB_STEP_SUMMARY"
          tail -n 8 frontend-test-results.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build frontend
        working-directory: frontend
        run: npm run build
