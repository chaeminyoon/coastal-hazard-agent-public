name: coastal-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COASTAL_POSTGRES_DB:-coastal}
      POSTGRES_USER: ${COASTAL_POSTGRES_USER:-coastal}
      POSTGRES_PASSWORD: ${COASTAL_POSTGRES_PASSWORD:?COASTAL_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${COASTAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - coastal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${COASTAL_REDIS_PASSWORD:?COASTAL_REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${COASTAL_REDIS_PORT:-6379}:6379"
    volumes:
      - coastal-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  coastal-postgres-data:
  coastal-redis-data:
