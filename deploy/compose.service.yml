name: coastal-agent-service

x-app-environment: &app-environment
  COASTAL_ENV: ${COASTAL_ENV:-development}
  COASTAL_AGENT_ROOT: /data/agent
  COASTAL_ARTIFACT_ROOT: /data/artifacts
  COASTAL_DATABASE_URL: ${COASTAL_DATABASE_URL:?COASTAL_DATABASE_URL is required}
  COASTAL_REDIS_URL: ${COASTAL_REDIS_URL:?COASTAL_REDIS_URL is required}
  COASTAL_SESSION_SECRET: ${COASTAL_SESSION_SECRET:?COASTAL_SESSION_SECRET is required}
  COASTAL_ALLOWED_ORIGINS: ${COASTAL_ALLOWED_ORIGINS:-http://localhost:8080}
  MCP_FONT_FAMILY: ${MCP_FONT_FAMILY:-Pretendard GOV}

x-app-base: &app-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - type: bind
      source: ${COASTAL_AGENT_ROOT:?COASTAL_AGENT_ROOT is required}
      target: /data/agent
      read_only: true
    - report-artifacts:/data/artifacts
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-base: &api-base
  <<: *app-base
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${COASTAL_HTTP_BIND:-127.0.0.1}:${COASTAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  api-1:
    <<: *api-base

  api-2:
    <<: *api-base

  worker:
    <<: *app-base
    command:
      - rq
      - worker
      - --url
      - ${COASTAL_REDIS_URL:?COASTAL_REDIS_URL is required}
      - --path
      - /app/backend
      - reports
    stop_grace_period: 5m

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    environment: *app-environment
    command:
      - alembic
      - -c
      - /app/alembic.ini
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COASTAL_POSTGRES_DB:-coastal}
      POSTGRES_USER: ${COASTAL_POSTGRES_USER:-coastal}
      POSTGRES_PASSWORD: ${COASTAL_POSTGRES_PASSWORD:?COASTAL_POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${COASTAL_REDIS_PASSWORD:?COASTAL_REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  report-artifacts:
