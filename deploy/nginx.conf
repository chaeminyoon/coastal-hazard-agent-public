worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format service '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'upstream=$upstream_addr response_time=$request_time';
    access_log /var/log/nginx/access.log service;

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream coastal_api {
        zone coastal_api 64k;
        least_conn;
        server api-1:8000 resolve max_fails=3 fail_timeout=10s;
        server api-2:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        client_max_body_size 55m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://coastal_api;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }

        location = / {
            expires -1;
            proxy_pass http://coastal_api;
            include /etc/nginx/conf.d/proxy-headers.conf;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://coastal_api;
            include /etc/nginx/conf.d/proxy-headers.conf;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
